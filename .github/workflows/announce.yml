name: Announce release

# Posts a Discord announcement when a GitHub Release is published. Decoupled
# from publish.yml on purpose: it fires for any published release (including
# manually-cut ones), and a failure here never affects the publish path.
#
# Setup (one-time): create a webhook on the Discord #announcements channel and
# add its URL as the `DISCORD_ANNOUNCE_WEBHOOK` repo/org secret. Until that
# secret exists the job runs and cleanly skips (no post, green run) — so this
# can merge before the webhook is wired.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to announce (e.g. v0.10.2)"
        required: true
      dry_run:
        description: "Print the payload without posting"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    # This announces the npm package only (`v*` tags). The Python package
    # (`nimblebrain-synapse-v*`) publishes on its own track and is not announced
    # here. The load-bearing guard is the `^v[0-9]` filter on PREV below; this
    # `if` is mostly defensive, since a `nimblebrain-synapse-v*` release cut by
    # publish-python.yml with GITHUB_TOKEN does not fire `release: published`
    # anyway (it only covers a hand-cut release or a manual dispatch).
    if: ${{ !startsWith(github.event.release.tag_name || github.event.inputs.tag, 'nimblebrain-synapse-') }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,body,url,publishedAt > release.json
          # Previous release tag for the compare link: the newest non-current
          # published release on the npm track (`v*` only — the Python
          # `nimblebrain-synapse-v*` track is excluded so the compare link never
          # crosses tracks). Assumes single-track sequential releases within npm
          # (semver order matches publish order). A backport published after a
          # higher version would yield a cosmetically backwards compare link;
          # switch the pipe to `sort -V` if synapse ever ships out of order.
          # Empty on the first release -> the script omits the compare link.
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
            --json tagName --jq '.[].tagName' | grep -E '^v[0-9]' | grep -vxF "$TAG" | head -n1 || true)
          echo "PREV_TAG=$PREV" >> "$GITHUB_ENV"

      - name: Announce to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
          REPO: ${{ github.repository }}
          RELEASE_JSON: release.json
          PREV_TAG: ${{ env.PREV_TAG }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node .github/scripts/announce-discord.mjs
