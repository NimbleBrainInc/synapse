[project]
name = "nimblebrain-synapse"
version = "0.5.1"
description = "Server half of the Synapse cross-host UI framework: register one self-contained ui:// component from a FastMCP server and render it in ChatGPT (OpenAI Apps SDK), Claude (MCP Apps), and the NimbleBrain runtime."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NimbleBrain Inc." }]
keywords = ["mcp", "fastmcp", "mcp-apps", "openai-apps", "synapse", "ui", "widget"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # register() passes meta= to @mcp.resource(); that kwarg landed in mcp 1.26.0.
    #
    # Capped BELOW 2 because this is v1 code, and the range has to say so. mcp 2.x renamed
    # `FastMCP` to `MCPServer` and `mcp.server.fastmcp` now raises ModuleNotFoundError on
    # import, so an unbounded floor resolved to 2.x and the package did not import at all —
    # for a fresh consumer install, not just in CI. `ServerResult` also stopped being a
    # RootModel, so `_attach` reads a `.root` that no longer exists.
    #
    # The cap is the honest statement of what this code supports, not a decision to stay on
    # v1: adopting 2.x is a migration with its own breaking change for consumers still on
    # 1.x, and it moves this line rather than removing the bound.
    "mcp>=1.26.0,<2",
]

[project.urls]
Homepage = "https://github.com/NimbleBrainInc/synapse"
Repository = "https://github.com/NimbleBrainInc/synapse"
Issues = "https://github.com/NimbleBrainInc/synapse/issues"
Changelog = "https://github.com/NimbleBrainInc/synapse/blob/main/python/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff==0.15.21",
    "ty==0.0.61",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nimblebrain_synapse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
