name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: biomejs/setup-biome@v2
        with:
          version: 2.4.9 # pin to the repo's @biomejs/biome devDep; `latest` drifted ahead and flagged pre-existing code
      - run: biome check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check dist output exists
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/react/index.js
          test -f dist/codegen/cli.js
          test -f dist/connect.iife.global.js
          test -f dist/synapse-ui.iife.global.js
      - name: Bundle-size budget
        # Limits and the reason for each are in the script.
        run: npm run size

  conformance:
    name: Conformance (spec host, real browser)
    # Our clients driven by the spec's own AppBridge in Chromium, and the spec's
    # own App driven against our dev preview host. Separate from `test` because
    # it needs a browser binary — `npm run ci` stays runnable on a fresh clone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The suite bundles its pages itself, and loads the cross-host client from
      # the build output: dist/synapse-ui.iife.global.js, the file npm publishes.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run conformance

  docs-build:
    name: Docs site build
    # web/ (the landing + Starlight docs) otherwise only builds in web-pages.yml
    # on push to main, so a broken docs build would first surface on the Pages
    # deploy. Mirror that build here (Node 22 + web/'s lockfile) as a PR gate;
    # `npm run build` runs Astro plus the internal-link validator.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
