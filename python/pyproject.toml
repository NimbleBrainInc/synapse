[project]
name = "nimblebrain-synapse"
version = "0.6.0"
description = "Server half of the Synapse cross-host UI framework: declare one self-contained ui:// component as an MCP extension and render it in ChatGPT (OpenAI Apps SDK), Claude (MCP Apps), and the NimbleBrain runtime."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NimbleBrain Inc." }]
keywords = ["mcp", "mcpserver", "mcp-apps", "openai-apps", "synapse", "ui", "widget"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # mcp 2.x only. SynapseUI is an `mcp.server.extension.Extension` (SEP-2133) and
    # takes its identifier and the MCP Apps MIME from `mcp.server.apps`; neither
    # module exists in 1.x, where `FastMCP` (now `MCPServer`) also had no
    # result-transform hook and this package patched `_mcp_server.request_handlers`
    # to get one. There is no 1.x-compatible shape for the current code, so the
    # floor is the first 2.x release rather than a range spanning both.
    #
    # Capped below 3 so the next major cannot reach a fresh install ahead of the
    # migration that supports it. That is what the missing cap cost at 2.0.
    "mcp>=2.0.0,<3",
]

[project.urls]
Homepage = "https://github.com/NimbleBrainInc/synapse"
Repository = "https://github.com/NimbleBrainInc/synapse"
Issues = "https://github.com/NimbleBrainInc/synapse/issues"
Changelog = "https://github.com/NimbleBrainInc/synapse/blob/main/python/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff==0.15.21",
    "ty==0.0.61",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nimblebrain_synapse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
